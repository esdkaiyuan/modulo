name: Deploy to GitHub Pages

on:
  push:
    branches:
      # The account/AI migration lives on the feature branch, main is far behind.
      - feature/vue3-multi-page-ui
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` also runs vue-tsc, which currently fails on pre-existing
      # type errors in the account/AI work-in-progress. Build only, so Pages
      # deployments are not blocked by that; run the type check once fixed.
      - name: Build
        run: npx vite build
        env:
          VITE_BASE: /modulo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4